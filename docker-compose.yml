services:
  postgres:
    image: postgres:16
    container_name: pension360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pension360
      POSTGRES_USER: pension360
      POSTGRES_PASSWORD: pension360
    ports:
      - "5432:5432"
    volumes:
      - pension360_pgdata:/var/lib/postgresql/data

volumes:
  pension360_pgdata:
